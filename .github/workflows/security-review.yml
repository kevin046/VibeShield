name: Security Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-review:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit

      - name: Run Bandit security scan
        run: bandit -r core/ api/ scripts/ -f json -o bandit-report.json || true

      - name: Run static analysis checks
        run: |
          echo "=== Checking for hardcoded secrets ==="
          grep -rn -E "(api_key|secret|password|token|private_key)\s*=\s*['\"][^'\"]+['\"]" core/ api/ scripts/ 2>/dev/null || echo "No hardcoded secrets found"
          echo "=== Checking for dangerous imports ==="
          grep -rn -E "^import (pickle|shelve|marshal|subprocess\.call)" core/ api/ scripts/ 2>/dev/null || echo "No dangerous imports found"
          echo "=== Checking for eval/exec usage ==="
          grep -rn -E "(eval|exec)\s*\(" core/ api/ scripts/ 2>/dev/null || echo "No eval/exec usage found"

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run safety check
        run: safety check --json || true

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install trufflehog
        run: pip install trufflehog

      - name: Scan for secrets
        run: trufflehog filesystem . --no-update || true

  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run ruff
        run: ruff check core/ api/ tests/ scripts/ --ignore E501 || true

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
